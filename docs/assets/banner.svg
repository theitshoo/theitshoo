<!-- Save as assets/banner.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Professional Profile Banner">
  <style>
    :root {
      --bg-a: #f8fafc;
      --bg-b: #f1f5f9;
      --text-main: #0f172a;
      --text-sub: #475569;
      --accent: #0ea5a1;
      --grid-line: rgba(15, 23, 42, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-a: #0a0f1a;
        --bg-b: #111827;
        --text-main: #ffffff;
        --text-sub: #94a3b8;
        --accent: #06b6d4;
        --grid-line: rgba(255, 255, 255, 0.03);
      }
    }
    text.title { 
        font-family: 'Fira Code', 'Segoe UI', monospace; 
        font-weight: 700; 
        fill: var(--text-main); 
        letter-spacing: -0.5px; 
    }
    text.subtitle { 
        font-family: 'Inter', 'Segoe UI', sans-serif; 
        fill: var(--text-sub); 
        letter-spacing: 1px; 
    }
  </style>

  <defs>
    <linearGradient id="bg-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="var(--bg-a)"/>
      <stop offset="1" stop-color="var(--bg-b)"/>
    </linearGradient>
  </defs>

  <!-- Background with adjusted sharp radius -->
  <rect width="1000" height="200" rx="4" fill="url(#bg-grad)"/>

  <!-- Structured, minimalist grid for precise framing -->
  <g stroke="var(--grid-line)" stroke-width="1" fill="none">
    <path d="M 0 40 L 1000 40 M 0 160 L 1000 160" />
    <path d="M 250 0 L 250 200 M 750 0 L 750 200" />
  </g>

  <!-- Perfectly Centered Text -->
  <text class="title" x="500" y="80" font-size="40" text-anchor="middle">
    Software Engineer
  </text>
  
  <text class="subtitle" x="500" y="130" font-size="25" text-anchor="middle">
    Backend (.NET) | DevOps
  </text>
  
  <text class="subtitle" x="500" y="160" font-size="18" text-anchor="middle">
    hesham.salah.sa@gmail.com
  </text>
  
  <!-- Subtle accent dots aligning with the grid intersections -->
  <circle cx="250" cy="40" r="2.5" fill="var(--accent)" opacity="0.6"/>
  <circle cx="750" cy="40" r="2.5" fill="var(--accent)" opacity="0.6"/>
  <circle cx="250" cy="160" r="2.5" fill="var(--accent)" opacity="0.6"/>
  <circle cx="750" cy="160" r="2.5" fill="var(--accent)" opacity="0.6"/>
</svg>
