<svg xmlns="http://www.w3.org/2000/svg" width="400" height="56" viewBox="0 0 400 56">

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="398"
    height="54"
    rx="14"
    fill="#18181B"
    stroke="#52525B"
    stroke-width="1.5"/>

  <!-- Inner border -->
  <rect
    x="5"
    y="5"
    width="390"
    height="46"
    rx="11"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.06"/>

  <!-- Top highlight -->
  <path
    d="M15 2.5H385"
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-linecap="round"/>


  <!-- Google Drive icon container -->
  <rect
    x="58"
    y="12"
    width="32"
    height="32"
    rx="9"
    fill="#FFFFFF"
    fill-opacity="0.06"
    stroke="#FFFFFF"
    stroke-opacity="0.10"/>

  <!-- Google Drive icon container -->
<rect
  x="58"
  y="12"
  width="32"
  height="32"
  rx="9"
  fill="#FFFFFF"
  fill-opacity="0.06"
  stroke="#FFFFFF"
  stroke-opacity="0.10"/>

<!-- Google Drive official-style logo -->
<image
  x="58"
  y="12"
  width="32"
  height="32"
  href="./google-drive.svg"
/>

  <!-- Text -->
  <text
    x="104"
    y="34"
    fill="#FAFAFA"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="bold">
    View CV on Google Drive
  </text>


  <!-- Divider -->
  <line
    x1="310"
    y1="18"
    x2="310"
    y2="38"
    stroke="#3F3F46"
    stroke-width="1"/>


  <!-- Arrow circle -->
  <circle
    cx="335"
    cy="28"
    r="11"
    fill="#FFFFFF"
    fill-opacity="0.05"
    stroke="#FFFFFF"
    stroke-opacity="0.10"/>

  <!-- Arrow -->
  <path
    d="M330 28H339"
    stroke="#E4E4E7"
    stroke-width="1.5"
    stroke-linecap="round"/>

  <path
    d="M335.5 24.5L339 28L335.5 31.5"
    fill="none"
    stroke="#E4E4E7"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

</svg>
