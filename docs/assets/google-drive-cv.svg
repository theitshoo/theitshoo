<svg xmlns="http://www.w3.org/2000/svg" width="400" height="56" viewBox="0 0 400 56">

  <!-- Background -->
  <rect
    x="1"
    y="1"
    width="398"
    height="54"
    rx="14"
    fill="#18181B"
    stroke="#52525B"
    stroke-width="1.5"/>

  <!-- Inner border -->
  <rect
    x="5"
    y="5"
    width="390"
    height="46"
    rx="11"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.06"/>

  <!-- Top highlight -->
  <path
    d="M15 2.5H385"
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-linecap="round"/>


<!-- Google Drive icon container -->
<rect
  x="58"
  y="12"
  width="35"
  height="35"
  rx="9"
  fill="#FFFFFF"
  fill-opacity="0.06"
  stroke="#FFFFFF"
  stroke-opacity="0.10"/>

<!-- Google Drive logo -->
<g transform="translate(64 18)">

  <svg
    x="0"
    y="0"
    width="22"
    height="22"
    viewBox="0 0 168 154"
    preserveAspectRatio="xMidYMid meet"
    overflow="visible">

    <defs>

      <linearGradient
        id="drive-yellow"
        x1="193.6"
        x2="103.09"
        y1="165.6"
        y2="111.21"
        gradientUnits="userSpaceOnUse">
        <stop offset=".09" stop-color="#FFE921"/>
        <stop offset="1" stop-color="#FEC700"/>
      </linearGradient>

      <linearGradient
        id="drive-blue"
        x1="114.4"
        x2="15.53"
        y1="181.61"
        y2="121.8"
        gradientUnits="userSpaceOnUse">
        <stop offset=".15" stop-color="#A9A8FF"/>
        <stop offset=".33" stop-color="#6D97FF"/>
        <stop offset=".48" stop-color="#3186FF"/>
      </linearGradient>

      <linearGradient
        id="drive-green"
        x1="128.88"
        x2="28.7"
        y1="37.88"
        y2="84.64"
        gradientUnits="userSpaceOnUse">
        <stop offset=".55" stop-color="#0EBC5F"/>
        <stop offset=".85" stop-color="#78C9FF"/>
      </linearGradient>

      <mask
        id="drive-mask"
        x="12"
        y="18"
        width="168"
        height="154"
        maskUnits="userSpaceOnUse">

        <path
          fill="#FFFFFF"
          d="M63.09 37c14.626-25.333 51.193-25.334 65.819 0l45.033 78c14.626 25.334-3.657 57.001-32.91 57.001H50.967c-29.253 0-47.536-31.667-32.91-57.001Z"/>

      </mask>

    </defs>

    <g mask="url(#drive-mask)">

      <path
        fill="url(#drive-yellow)"
        d="M206.905 172.02h-91.888l-19.015-32.934 45.944-79.578Z"/>

      <path
        fill="url(#drive-blue)"
        d="M-14.919 172.006 50.04 59.494v.002L31.032 92.422h38.02L115 172.004l-129.918.001Z"/>

      <path
        fill="url(#drive-green)"
        d="M96.007-20.085 141.954 59.5l-19.011 32.928H31.048Z"/>

    </g>

  </svg>

</g>

  <!-- Text -->
  <text
    x="104"
    y="34"
    fill="#FAFAFA"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="bold">
    View CV on Google Drive
  </text>


  <!-- Divider -->
  <line
    x1="310"
    y1="18"
    x2="310"
    y2="38"
    stroke="#3F3F46"
    stroke-width="1"/>


  <!-- Arrow circle -->
  <circle
    cx="335"
    cy="28"
    r="11"
    fill="#FFFFFF"
    fill-opacity="0.05"
    stroke="#FFFFFF"
    stroke-opacity="0.10"/>

  <!-- Arrow -->
  <path
    d="M330 28H339"
    stroke="#E4E4E7"
    stroke-width="1.5"
    stroke-linecap="round"/>

  <path
    d="M335.5 24.5L339 28L335.5 31.5"
    fill="none"
    stroke="#E4E4E7"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>

</svg>
